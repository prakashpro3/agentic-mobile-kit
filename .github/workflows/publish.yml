# Publishes to npm through trusted publishing (OIDC), so no npm token is stored anywhere.
# The release is only staged: a maintainer approves it on npm with 2FA before it goes live.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # lets npm verify that this workflow is the trusted publisher

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Install npm 12 (needed for stage publish)
        run: npm install -g npm@12.2.0
      - name: Stage the release on npm
        run: npm stage publish . --provenance --access public
