# Runs the kit's tests on macOS, Windows and Linux.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Git identity for the tests' commits
        run: git config --global user.name test && git config --global user.email test@example.invalid
      - name: Unit tests
        run: node --test tests/*.test.js
      - name: Guard hook tests
        run: sh tests/guard.test.sh
      - name: init, doctor and uninstall on a fresh app, with real tool-config generation
        run: |
          app=$(mktemp -d)
          cd "$app"
          printf '{"name":"Demo","dependencies":{"react-native":"0.87.1"}}' > package.json
          mkdir ios android && touch ios/.keep android/.keep
          git init -q && git add -A && git commit -qm app
          node "$GITHUB_WORKSPACE/bin/cli.js" init
          test -f .agents/skills/m-feature/SKILL.md
          test -f .claude/skills/m-feature/SKILL.md
          test -f .claude/settings.json # generated through npx
          git add -A && git commit -qm kit # runs the kit's pre-commit hook
          node "$GITHUB_WORKSPACE/bin/cli.js" doctor || true
          node "$GITHUB_WORKSPACE/bin/cli.js" uninstall
          git status --short
      - name: The same for an Expo app without ios/ and android/
        run: |
          app=$(mktemp -d)
          cd "$app"
          printf '{"name":"DemoExpo","dependencies":{"expo":"~57.0.27","react-native":"0.86.3"}}' > package.json
          printf '{"expo":{"name":"DemoExpo","slug":"demo-expo"}}' > app.json
          git init -q && git add -A && git commit -qm app
          node "$GITHUB_WORKSPACE/bin/cli.js" init
          grep -q 'stack=expo' AGENTS.md
          test -f .agents/skills/expo-router/SKILL.md
          test -f .claude/skills/expo-router/SKILL.md
          grep -q 'ios/\*\*' .claude/settings.json # Expo's permissions: generated folders aren't edited
          git add -A && git commit -qm kit # runs the kit's pre-commit hook
          node "$GITHUB_WORKSPACE/bin/cli.js" doctor || true
          node "$GITHUB_WORKSPACE/bin/cli.js" uninstall
          git status --short
