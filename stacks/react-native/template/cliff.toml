# git-cliff config: CHANGELOG.md from commit messages (https://git-cliff.org). The m-release skill runs it.
# Conventional commits (feat:, fix:, perf:) get their own sections; other commit messages go under "Other".

[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.breaking %} (breaking){% endif %}\
{% endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^(chore|ci|build|test|style|docs|refactor)(\\(.*\\))?!?:", skip = true },
  { message = "^(Merge|Revert \"Merge)", skip = true },
  { message = ".*", group = "<!-- 3 -->Other" },
]
