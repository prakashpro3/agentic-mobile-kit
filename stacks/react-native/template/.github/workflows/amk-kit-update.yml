# agentic-mobile-kit: the kit's next version as a pull request, once a week (added with --ci github). One job runs the
# latest kit's sync with read-only rights and no secrets, and keeps the change it makes as a patch; the other, which runs
# no code from npm, puts the patch on a branch of its own, amk/kit-<version>, and opens the pull request with what sync
# said: the files it updated or merged, and any it couldn't merge (their .mine copy holds your version). It never
# merges and never rewrites a branch: a version that has its branch already is skipped, so a person's fixes there stay.
# With the AI jobs' GitHub App (AMK_APP_CLIENT_ID variable, AMK_APP_PRIVATE_KEY secret), the pull request gets CI like
# any other; with the workflow's own token it gets none (GitHub's rule: push an empty commit to start it), and the
# repository must let GitHub Actions create pull requests (Settings > Actions > General).
name: amk-kit-update

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sync.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - id: sync
        run: |
          before=$(grep -o 'agentic-mobile-kit [0-9.]*' AGENTS.md | head -1 | cut -d' ' -f2)
          npx -y agentic-mobile-kit@latest sync < /dev/null > "$RUNNER_TEMP/sync.txt" 2>&1 || true
          cat "$RUNNER_TEMP/sync.txt"
          version=$(grep -o 'agentic-mobile-kit [0-9.]*' AGENTS.md | head -1 | cut -d' ' -f2)
          git add -A
          if [ "$version" = "$before" ] || git diff --cached --quiet; then echo "kit $before is the latest: nothing to do"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/kit"
          git diff --cached --binary > "$RUNNER_TEMP/kit/kit.patch"
          cp "$RUNNER_TEMP/sync.txt" "$RUNNER_TEMP/kit/sync.txt"
          echo "$before" > "$RUNNER_TEMP/kit/before"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: steps.sync.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-update
          path: ${{ runner.temp }}/kit
          retention-days: 7

  pull-request:
    needs: sync
    if: needs.sync.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.sync.outputs.version }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - id: app
        if: vars.AMK_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AMK_APP_CLIENT_ID }}
          private-key: ${{ secrets.AMK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-update
          path: ${{ runner.temp }}/kit
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          branch="amk/kit-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then echo "$branch is there already: its pull request has this version"; exit 0; fi
          git switch -c "$branch"
          git apply --index "$RUNNER_TEMP/kit/kit.patch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "chore: update agentic-mobile-kit to $VERSION"
          git push origin "$branch"
          {
            echo "The kit's update from $(cat "$RUNNER_TEMP/kit/before") to $VERSION, as \`npx agentic-mobile-kit@latest sync\` makes it. What changes: https://github.com/prakashpro3/agentic-mobile-kit/releases/tag/v$VERSION"
            echo
            echo "A file listed as not merged has the kit's version in place and yours beside it, as <file>.mine: bring your changes back, then delete the .mine copy. Review it like any change; it merges only when a person merges it."
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/kit/sync.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "$BASE" --head "$branch" --title "Update agentic-mobile-kit to $VERSION" --body-file "$RUNNER_TEMP/body.md"
