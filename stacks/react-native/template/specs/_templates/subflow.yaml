#       file: subflows/reset-data.js
#       env:
#         API_URL: ${MAESTRO_API_URL}
#         TEST_TOKEN: ${MAESTRO_TEST_TOKEN}
# Maestro runs it with its own JavaScript, which has http (docs.maestro.dev: Make HTTP requests) and reads the env
# values as plain variables. MAESTRO_API_URL and MAESTRO_TEST_TOKEN go in .maestro/.env.local. Point it at the app's
# own test-only endpoint and test account, never at production data.
